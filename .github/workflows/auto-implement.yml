name: Auto Implement Issue

on:
  issues:
    types: [labeled]

jobs:
  implement:
    if: github.event.label.name == 'auto-implement'
    runs-on: self-hosted
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark in-progress
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue.number;
            await github.rest.issues.removeLabel({
              ...context.repo, issue_number: issue, name: 'auto-implement'
            }).catch(() => {});
            await github.rest.issues.addLabels({
              ...context.repo, issue_number: issue, labels: ['in-progress']
            });

      - name: Create branch
        run: |
          BRANCH="auto/issue-${{ github.event.issue.number }}"
          git checkout -b "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Build prompt
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          cat > /tmp/prompt.txt <<EOF
          あなたはシニアフルスタックエンジニアです。
          以下の GitHub Issue を実装してください。

          ## ルール
          - CLAUDE.md のコーディング規約・アーキテクチャに従うこと
          - 実装前に既存コードを読み、整合性を確認すること
          - テストを書き、パスすることを確認すること
          - コミットメッセージは Conventional Commits に従うこと
          - 不明点があれば最善の判断をし、判断理由をコミットメッセージに記載すること

          ## Issue 情報
          タイトル: ${ISSUE_TITLE}
          本文:
          ${ISSUE_BODY}
          番号: #${ISSUE_NUMBER}
          EOF

      - name: Implement with Claude Code (Max plan)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat /tmp/prompt.txt | claude --print \
            --max-turns 50 \
            --model claude-sonnet-4-20250514 \
            --allowedTools "Bash,Read,Write,Edit,MultiEdit,Glob,Grep"

      - name: Create PR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 変更がある場合のみPR作成
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "feat: implement #${{ github.event.issue.number }}"
          fi

          git push origin "$BRANCH"

          gh pr create \
            --title "feat: ${{ github.event.issue.title }}" \
            --body "$(cat <<EOF
          ## 変更内容
          Issue #${{ github.event.issue.number }} の自動実装

          ## Issue
          ${{ github.event.issue.title }}

          Closes #${{ github.event.issue.number }}
          EOF
          )" \
            --base main \
            --head "$BRANCH"

      - name: Mark pr-created
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue.number;
            await github.rest.issues.removeLabel({
              ...context.repo, issue_number: issue, name: 'in-progress'
            }).catch(() => {});
            await github.rest.issues.addLabels({
              ...context.repo, issue_number: issue, labels: ['pr-created']
            });

      - name: Mark failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue.number;
            await github.rest.issues.removeLabel({
              ...context.repo, issue_number: issue, name: 'in-progress'
            }).catch(() => {});
            await github.rest.issues.addLabels({
              ...context.repo, issue_number: issue, labels: ['failed']
            });
            await github.rest.issues.createComment({
              ...context.repo, issue_number: issue,
              body: '⚠️ 自動実装に失敗しました。ワークフローのログを確認してください。\n\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            });
