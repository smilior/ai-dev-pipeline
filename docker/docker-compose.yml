services:
  runner:
    build: .
    container_name: claude-runner
    restart: unless-stopped
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO=${GITHUB_REPO}
      - RUNNER_TOKEN=${RUNNER_TOKEN}
      - RUNNER_NAME=${RUNNER_NAME:-claude-runner}
      - RUNNER_LABELS=${RUNNER_LABELS:-self-hosted}
    volumes:
      - runner-work:/home/runner/work
      - ${HOME}/.claude:/home/runner/.claude:ro  # Max プラン認証情報
      - ${HOME}/.claude.json:/home/runner/.claude.json:ro  # Claude 設定ファイル
    deploy:
      resources:
        limits:
          memory: 8G

volumes:
  runner-work:
